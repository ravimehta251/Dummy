apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-v1-1
  namespace: product-v1-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-v1-1
  template:
    metadata:
      labels:
        app: product-v1-1
    spec:
      containers:
        - name: product-catalogue
          image: product-catalogue:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /v1.1/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1.1/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20